<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Quadrinho - DC Comics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-warning sticky-top">
    <div class="container">
      <a class="navbar-brand text-warning fw-bold" href="index.html">🦇 DC Comics</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <li class="nav-item d-none" id="nav-favoritos">
  <a class="nav-link text-warning" href="favoritos.html">⭐ Favoritos</a>
</li>
<li class="nav-item d-none" id="nav-cadastro-item">
  <a class="nav-link fw-bold text-success" href="cadastro-item.html">➕ Novo Item</a>
</li>
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html#quadrinhos">Quadrinhos</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#sobre">Sobre</a></li>

          <div id="menu-deslogado" class="d-flex ms-lg-3">
            <li class="nav-item">
              <a class="btn btn-outline-warning btn-sm mt-1 mt-lg-0 me-2" href="login.html">Login</a>
            </li>
            <li class="nav-item">
              <a class="btn btn-warning btn-sm mt-1 mt-lg-0 text-dark fw-bold" href="cadastro.html">Cadastre-se</a>
            </li>
          </div>

          <div id="menu-logado" class="d-flex ms-lg-3 align-items-center d-none">
            <span id="nomeUsuario" class="text-light me-3 fw-bold"></span>
            <button class="btn btn-danger btn-sm" onclick="fazerLogout()">Sair</button>
          </div>
        </ul>
      </div>
    </div>
  </nav>

  <section class="container my-5" id="conteudo">
    <div class="text-center text-warning">Carregando detalhes...</div>
  </section>

  <footer class="text-center py-4 bg-dark text-secondary border-top border-warning">
    <p>Feito por um fã que apenas quer tirar uma nota boa no trabalho — DC Comics © 2025</p>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    async function carregarPaginaDetalhes() {
      try {
        const resposta = await fetch(`http://localhost:3000/quadrinhos/${id}`);
        if (!resposta.ok) throw new Error("Quadrinho não encontrado.");
        const q = await resposta.json();

        document.getElementById("conteudo").innerHTML = `
          <div class="row align-items-center">
            <div class="col-md-5 text-center">
              <img src="img/${q.imagem}" class="img-fluid rounded shadow-lg border border-warning" alt="${q.titulo}">
            </div>

            <div class="col-md-7">
              <h1 class="text-warning mb-3">${q.titulo}</h1>
              <p class="lead">${q.descricao}</p>
              <ul class="list-group list-group-flush bg-transparent">
                <li class="list-group-item bg-transparent text-light border-warning"><strong>Ano:</strong> ${q.ano || "Desconhecido"}</li>
                <li class="list-group-item bg-transparent text-light border-warning"><strong>Autor:</strong> ${q.autor || "Desconhecido"}</li>
                <li class="list-group-item bg-transparent text-light border-warning"><strong>Editora:</strong> ${q.editora || "DC Comics"}</li>
                <li class="list-group-item bg-transparent text-light border-warning"><strong>Personagens:</strong> ${q.personagens || "Vários"}</li>
              </ul>
              <div class="mt-4 d-flex gap-2">
                <a href="index.html" class="btn btn-warning">⬅ Voltar</a>
                <button class="btn btn-outline-warning" onclick="editarQuadrinhoLocal(${q.id})">✏️ Editar</button>
                <button class="btn btn-outline-danger" onclick="deletarQuadrinhoLocal(${q.id})">🗑 Excluir</button>
              </div>
            </div>
          </div>
        `;
      } catch (erro) {
        document.getElementById("conteudo").innerHTML = `
          <div class="text-center text-warning mt-5">
            <h1>Quadrinho não encontrado 😢</h1>
            <a href="index.html" class="btn btn-warning mt-3">Voltar</a>
          </div>
        `;
      }
    }

    // Funções locais para usar a API corretamente
    async function deletarQuadrinhoLocal(id) {
      if (!confirm("Tem certeza que deseja excluir este quadrinho?")) return;
      await fetch(`http://localhost:3000/quadrinhos/${id}`, { method: "DELETE" });
      alert("Quadrinho excluído com sucesso!");
      window.location.href = "index.html";
    }

    async function editarQuadrinhoLocal(id) {
      const novoTitulo = prompt("Novo título:");
      if (!novoTitulo) return;
      await fetch(`http://localhost:3000/quadrinhos/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ titulo: novoTitulo })
      });
      alert("Quadrinho atualizado!");
      location.reload();
    }

    carregarPaginaDetalhes();
  </script>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
