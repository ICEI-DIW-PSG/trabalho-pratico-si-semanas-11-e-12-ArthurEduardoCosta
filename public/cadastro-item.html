<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Quadrinho - DC Comics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-warning sticky-top">
    <div class="container">
      <a class="navbar-brand text-warning fw-bold" href="index.html">🦇 DC Comics</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html#quadrinhos">Quadrinhos</a></li>
          <li class="nav-item"><a class="nav-link" href="apresentacao.html">📊 Apresentação</a></li>
          
          <li class="nav-item d-none" id="nav-favoritos">
            <a class="nav-link text-warning" href="favoritos.html">⭐ Favoritos</a>
          </li>

          <li class="nav-item d-none" id="nav-cadastro-item">
            <a class="nav-link fw-bold text-success active" href="cadastro-item.html">➕ Novo Item</a>
          </li>

          <li class="nav-item"><a class="nav-link" href="index.html#sobre">Sobre</a></li>

          <div id="menu-deslogado" class="d-flex ms-lg-3">
            <li class="nav-item"><a class="btn btn-outline-warning btn-sm me-2" href="login.html">Login</a></li>
            <li class="nav-item"><a class="btn btn-warning btn-sm fw-bold" href="cadastro.html">Cadastre-se</a></li>
          </div>
          <div id="menu-logado" class="d-flex ms-lg-3 align-items-center d-none">
            <span id="nomeUsuario" class="text-light me-3 fw-bold"></span>
            <button class="btn btn-danger btn-sm" onclick="fazerLogout()">Sair</button>
          </div>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card bg-black border border-warning shadow-lg">
          <div class="card-header border-warning text-center">
            <h2 class="text-warning mb-0">Cadastrar Novo Quadrinho</h2>
          </div>
          <div class="card-body p-4">
            
            <form id="formCadastroItemPagina">
              
              <div class="row">
                <div class="col-md-12 mb-3">
                  <label class="form-label text-warning">Título do Quadrinho</label>
                  <input type="text" class="form-control bg-dark text-light border-secondary" id="titulo" required>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label text-warning">Ano de Lançamento</label>
                  <input type="number" class="form-control bg-dark text-light border-secondary" id="ano" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label text-warning">Autor / Artista</label>
                  <input type="text" class="form-control bg-dark text-light border-secondary" id="autor" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label text-warning">Descrição / Sinopse</label>
                <textarea class="form-control bg-dark text-light border-secondary" id="descricao" rows="3" required></textarea>
              </div>

              <div class="mb-3">
                <label class="form-label text-warning">Nome da Imagem</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="imagem" placeholder="Ex: batman.jpg" required>
                <div class="form-text text-secondary">A imagem deve estar salva na pasta "img" do projeto.</div>
              </div>

              <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-warning fw-bold btn-lg">SALVAR QUADRINHO</button>
                <a href="index.html" class="btn btn-outline-secondary">Cancelar</a>
              </div>

            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center py-4 bg-dark text-secondary border-top border-warning">
    <p>DC Comics © 2025</p>
  </footer>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    if (!localStorage.getItem("usuarioLogado")) {
      alert("Você precisa estar logado para acessar esta página.");
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
