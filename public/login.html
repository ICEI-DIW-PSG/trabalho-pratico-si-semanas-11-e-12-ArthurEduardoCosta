<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DC Comics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center vh-100">

  <div class="card bg-black border border-warning shadow-lg p-4" style="width: 100%; max-width: 400px;">
    <div class="text-center mb-4">
      <h2 class="text-warning fw-bold">🦇 Login</h2>
      <p class="text-secondary">Bem-vindo de volta a Gotham.</p>
    </div>

    <form id="formLogin">
      <div class="mb-3">
        <label class="form-label text-warning">E-mail</label>
        <input type="email" class="form-control bg-dark text-light border-secondary" id="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-warning">Senha</label>
        <input type="password" class="form-control bg-dark text-light border-secondary" id="senha" required>
      </div>

      <button type="submit" class="btn btn-warning w-100 fw-bold">ENTRAR</button>
    </form>

    <div class="mt-3 text-center">
      <a href="cadastro.html" class="text-decoration-none text-secondary">Não tem conta? Cadastre-se</a>
      <br>
      <a href="index.html" class="text-decoration-none text-secondary mt-2 d-inline-block">Voltar ao Início</a>
    </div>
  </div>

  <script>
    document.getElementById("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      try {
        
        const response = await fetch(`http://localhost:3000/usuarios?email=${email}&senha=${senha}`);
        const users = await response.json();

        if (users.length > 0) {
          
          const usuario = users[0];
          alert(`Bem-vindo, ${usuario.nome}!`);
          
          
          localStorage.setItem("usuarioLogado", JSON.stringify(usuario));
          
          window.location.href = "index.html";
        } else {
          alert("E-mail ou senha incorretos!");
        }
      } catch (error) {
        console.error(error);
        alert("Erro ao conectar com o servidor.");
      }
    });
  </script>

</body>
</html>
