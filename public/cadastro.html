<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - DC Comics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center vh-100">

  <div class="card bg-black border border-warning shadow-lg p-4" style="width: 100%; max-width: 400px;">
    <div class="text-center mb-4">
      <h2 class="text-warning fw-bold"> Junte-se à Liga</h2>
      <p class="text-secondary">Crie sua conta .</p>
    </div>

    <form id="formCadastro">
      <div class="mb-3">
        <label class="form-label text-warning">Nome</label>
        <input type="text" class="form-control bg-dark text-light border-secondary" id="nome" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-warning">E-mail</label>
        <input type="email" class="form-control bg-dark text-light border-secondary" id="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-warning">Senha</label>
        <input type="password" class="form-control bg-dark text-light border-secondary" id="senha" required>
      </div>

      <button type="submit" class="btn btn-warning w-100 fw-bold">CADASTRAR</button>
    </form>

    <div class="mt-3 text-center">
      <a href="login.html" class="text-decoration-none text-secondary hover-warning">Já tem conta? Faça Login</a>
      <br>
      <a href="index.html" class="text-decoration-none text-secondary mt-2 d-inline-block">Voltar ao Início</a>
    </div>
  </div>

  <script>
    document.getElementById("formCadastro").addEventListener("submit", async (e) => {
      e.preventDefault();

      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      
      const check = await fetch(`http://localhost:3000/usuarios?email=${email}`);
      const userExists = await check.json();

      if (userExists.length > 0) {
        alert("Este e-mail já está cadastrado!");
        return;
      }

      
      await fetch("http://localhost:3000/usuarios", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome, email, senha })
      });

      alert("Cadastro realizado com sucesso! Faça login.");
      window.location.href = "login.html";
    });
  </script>

</body>
</html>
